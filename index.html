<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Festa Anna40 📷</title>
  <meta name="theme-color" content="#ffffff" />
  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="main.css" />
</head>
<body>

  <!-- LOGIN -->
  <div id="screen-login" class="active">
    <div class="login-card">
      <div class="login-icon">🎉</div>
      <h1 class="login-title">Festa <span>Anna40</span></h1>
      <p class="login-sub">Fes fotos i comparteix-les<br>amb tothom a la festa!</p>
      <button id="btn-login" class="btn-google">
        <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#FFC107" d="M43.611 20.083H42V20H24v8h11.303c-1.649 4.657-6.08 8-11.303 8-6.627 0-12-5.373-12-12s5.373-12 12-12c3.059 0 5.842 1.154 7.961 3.039l5.657-5.657C34.046 6.053 29.268 4 24 4 12.955 4 4 12.955 4 24s8.955 20 20 20 20-8.955 20-20c0-1.341-.138-2.65-.389-3.917z"/><path fill="#FF3D00" d="m6.306 14.691 6.571 4.819C14.655 15.108 18.961 12 24 12c3.059 0 5.842 1.154 7.961 3.039l5.657-5.657C34.046 6.053 29.268 4 24 4 16.318 4 9.656 8.337 6.306 14.691z"/><path fill="#4CAF50" d="M24 44c5.166 0 9.86-1.977 13.409-5.192l-6.19-5.238A11.91 11.91 0 0 1 24 36c-5.202 0-9.619-3.317-11.283-7.946l-6.522 5.025C9.505 39.556 16.227 44 24 44z"/><path fill="#1976D2" d="M43.611 20.083H42V20H24v8h11.303a12.04 12.04 0 0 1-4.087 5.571l.003-.002 6.19 5.238C36.971 39.205 44 34 44 24c0-1.341-.138-2.65-.389-3.917z"/></svg>
        Entra amb Google per pujar fotos
      </button>
    </div>
  </div>

  <!-- APP -->
  <div id="screen-app" class="hidden">

    <header class="app-header">
      <div>
        <div class="app-logo">Festa <span>Anna40</span> 🎉</div>
      </div>
      <div class="app-header-user">
        <img id="user-avatar" src="" alt="" class="app-avatar" />
        <button id="btn-logout" class="app-logout-btn">Sortir</button>
      </div>
    </header>

    <!-- Panel: FER FOTO -->
    <div id="panel-foto">

      <!-- Només fotos -->
      <input type="file" id="camera-input-foto" accept="image/*" capture="environment" class="hidden" />

      <button id="btn-open-foto" class="camera-btn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
          <circle cx="12" cy="13" r="4"/>
        </svg>
        📷 Fer foto
      </button>

      <div id="photo-preview" class="preview-wrap"></div>

      <div id="tags-zone" class="tags-zone hidden">
        <p class="tags-section-title">Qui surt a la foto?</p>
        <div class="chips-wrap" id="chips-persones"></div>
        <div class="tag-add-wrap">
          <input type="text" id="input-nova-persona" class="tag-add-input" placeholder="Afegir persona..." autocomplete="off" />
          <button id="btn-add-persona" class="tag-add-btn">+ Afegir</button>
        </div>

        <p class="tags-section-title" style="margin-top:1rem">Categoria</p>
        <div class="chips-wrap" id="chips-categoria"></div>
        <div class="tag-add-wrap">
          <input type="text" id="input-nova-categoria" class="tag-add-input" placeholder="Afegir categoria..." autocomplete="off" />
          <button id="btn-add-categoria" class="tag-add-btn">+ Afegir</button>
        </div>

        <p class="tags-section-title" style="margin-top:1rem">Comentari</p>
        <textarea id="tag-notes" class="notes-input" rows="2" placeholder="Escriu aquí el que vulguis..."></textarea>
      </div>

      <button id="btn-pujar" class="btn-pujar hidden">📤 Pujar foto</button>

      <div id="upload-progress" class="progress-bar hidden">
        <div class="progress-fill"></div>
      </div>

    </div>

    <!-- Panel: VEURE FOTOS -->
    <div id="panel-veure" class="hidden">

      <div class="veure-toolbar">
        <span id="fotos-count" class="fotos-count">0 fotos</span>
        <button id="btn-refresh" class="btn-tool">↻ Ara</button>
        <button id="btn-auto-refresh" class="btn-tool active">⏸ Auto</button>
      </div>

      <!-- Slider hores -->
      <div class="hour-slider-wrap">
        <div class="hour-slider-pill">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
          <span id="hour-range-label" class="hour-slider-label">0h – 24h</span>
          <div class="hour-sliders">
            <div class="hour-slider-track"></div>
            <input type="range" id="hour-min" min="0" max="24" value="0" step="1" />
            <input type="range" id="hour-max" min="0" max="24" value="24" step="1" />
          </div>
        </div>
      </div>

      <!-- Filtre persones -->
      <p class="filter-label">Filtra per persona</p>
      <div class="filter-chips" id="filter-persones"></div>

      <!-- Graella -->
      <div class="fotos-grid" id="fotos-grid"></div>

    </div>

    <!-- Lightbox -->
    <div id="lightbox" class="hidden">
      <div class="lb-content">
        <div class="lb-img-wrap">
          <img id="lb-img" src="" alt="" />
        </div>
        <div class="lb-info">
          <div id="lb-hora" class="lb-hora"></div>
          <div id="lb-autor" class="lb-autor"></div>
          <div id="lb-persones" class="lb-persones"></div>
          <div id="lb-notes" class="lb-notes"></div>
        </div>
        <div class="lb-nav">
          <button id="lb-prev" class="lb-nav-btn">‹ Anterior</button>
          <span id="lb-counter"></span>
          <button id="lb-next" class="lb-nav-btn">Següent ›</button>
        </div>
      </div>
      <button id="lb-close" class="lb-close">✕</button>
      <button id="lb-edit" class="lb-edit hidden" title="Editar">✏️</button>
    </div>

    <!-- Modal edició -->
    <div id="edit-modal" class="edit-modal-overlay hidden">
      <div class="edit-modal">
        <div class="edit-modal-handle"></div>
        <div class="edit-modal-body">
          <h3 class="edit-modal-title">✏️ Editar foto</h3>
          <p class="edit-modal-label">Qui surt?</p>
          <div class="chips-wrap" id="edit-chips-persones"></div>
          <p class="edit-modal-label" style="margin-top:1rem">Comentari</p>
          <textarea id="edit-notes" class="notes-input" rows="2" placeholder="Comentari..."></textarea>
          <div class="edit-modal-actions">
            <button id="edit-delete-btn" class="edit-delete-btn">🗑️ Eliminar foto</button>
            <div style="display:flex;gap:8px">
              <button id="edit-cancel-btn" class="edit-cancel-btn">Cancel·lar</button>
              <button id="edit-save-btn" class="edit-save-btn">Guardar</button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Bottom nav -->
    <nav class="bottom-nav">
      <button class="nav-tab active" data-tab="foto">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
          <circle cx="12" cy="13" r="4"/>
        </svg>
        <span>Fer foto</span>
      </button>
      <button class="nav-tab" data-tab="veure">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="3" width="18" height="18" rx="3"/>
          <circle cx="8.5" cy="8.5" r="1.5"/>
          <polyline points="21,15 16,10 5,21"/>
        </svg>
        <span>Veure fotos</span>
      </button>
    </nav>

  </div>

  <!-- Google OAuth -->
  <script src="https://accounts.google.com/gsi/client" async></script>
  <script src="config.js"></script>
  <script src="auth.js"></script>
  <script src="sheets.js"></script>
  <script src="drive.js"></script>
  <script src="app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js').then(r => {
        console.log('SW registrat:', r.scope);
      }).catch(e => console.warn('SW error:', e));
    }
  </script>

</body>
</html>
